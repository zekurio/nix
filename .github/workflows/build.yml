name: Build hosts

on:
  push:
    branches: [main]
  pull_request:

# PRs from the weekly update-flake-lock workflow are opened with the default
# GITHUB_TOKEN, and GitHub never triggers workflows for actions taken by that
# token. Those PRs therefore get no checks here; the push-to-main trigger is
# what catches breakage after they merge, ahead of adam's Sunday auto-upgrade.
# To gate the update PRs themselves, hand update-flake-lock a PAT instead.

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # x86_64-linux NixOS hosts; sachiel is aarch64-darwin and would need a
        # macos runner.
        host: [adam, lilith]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      # Full toplevel, not just evaluation: fixed-output hash mismatches (e.g.
      # caddy.withPlugins after a nixpkgs bump) only fail at build time.
      - name: Build ${{ matrix.host }} toplevel
        run: nix build --print-out-paths '.#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel' --no-link

      - name: Run flake checks
        run: nix flake check --no-build
