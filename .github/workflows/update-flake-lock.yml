name: Update flake.lock

on:
  schedule:
    # Weekly, Saturday night: leaves the PR waiting for review well before
    # adam's Sunday 03:00 Europe/Vienna auto-upgrade window. Updates only
    # reach adam once the PR is merged to main.
    - cron: "15 23 * * 6"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-flake-lock:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Update flake.lock and open PR
        uses: DeterminateSystems/update-flake-lock@v28
        with:
          pr-title: "chore(flake): update flake.lock"
          commit-msg: "chore(flake): update flake.lock"
          pr-labels: dependencies
