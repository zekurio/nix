name: Update flake.lock

on:
  schedule:
    # Daily, early morning in Europe/Vienna. adam and lilith both upgrade
    # from main, so a pushed update reaches them on their next upgrade.
    - cron: "15 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-flake-lock
  cancel-in-progress: false

jobs:
  update-flake-lock:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Update flake.lock
        run: nix flake update

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The update lands on main unreviewed, so it must pass the same check as
      # a push. abort-on-warn fails the run when a workaround tied to one
      # upstream release outlives it, and nothing is pushed.
      - name: Check the flake
        if: steps.diff.outputs.changed == 'true'
        run: nix flake check --option abort-on-warn true

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(flake): update flake.lock" flake.lock
          git push origin HEAD:main
