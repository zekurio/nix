name: Update flake.lock

on:
  schedule:
    # Daily, early morning in Europe/Vienna, so the PR is ready to review
    # during the day and lilith's nightly upgrade picks up a merge that same
    # night. An open PR is updated in place rather than duplicated. Updates
    # only reach adam and lilith, which both upgrade from main, once the PR
    # is merged.
    - cron: "15 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-flake-lock:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Update flake.lock and open PR
        uses: DeterminateSystems/update-flake-lock@v28
        with:
          pr-title: "chore(flake): update flake.lock"
          commit-msg: "chore(flake): update flake.lock"
          pr-labels: dependencies
