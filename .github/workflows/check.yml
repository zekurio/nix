name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      # Evaluates adam and lilith, sachiel through its check, and runs the
      # tests. abort-on-warn fails the run on any evaluation warning, such as
      # a deprecation or a workaround that outlived the version it fixes.
      - name: Check the flake
        run: nix flake check --option abort-on-warn true
