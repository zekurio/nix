name: Update flake.lock

on:
  schedule:
    # Open the PR before Adam's Sunday upgrade. Updates need review and merge.
    - cron: "15 23 * * 6"
  workflow_dispatch:

jobs:
  update-flake-lock:
    runs-on: small
    steps:
      - name: Install runner tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends sudo

      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@v4
        with:
          ref: main

      - name: Install Nix
        uses: https://github.com/cachix/install-nix-action@v31
        with:
          install_options: --no-daemon
          enable_kvm: false
          extra_nix_config: |
            sandbox = false
            max-jobs = 1
            cores = 2

      - name: Update flake.lock and open PR
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGEJO_SERVER_URL: ${{ forgejo.server_url }}
          FORGEJO_REPOSITORY: ${{ forgejo.repository }}
        run: bash .forgejo/scripts/update-flake-lock.sh
