runtime:
  database_path: /var/lib/anvil/anvil.db
  temp_dir: /var/tmp/anvil
  scan_interval: 30s
  workers: 3
  permissions:
    directory_mode: "0775"
    file_mode: "0664"

web:
  enabled: true
  listen: 0.0.0.0:46845
  read_timeout: 15s
  write_timeout: 15s
  idle_timeout: 60s

arr_instances:
  - name: sonarr
    type: sonarr
    url: http://127.0.0.1:8989/sonarr
    api_key: !secret SONARR_API_KEY
    path_map:
      local_prefix: /mnt/downloads/complete/sonarr
      arr_prefix: /mnt/downloads/complete/sonarr

  - name: radarr
    type: radarr
    url: http://127.0.0.1:7878/radarr
    api_key: !secret RADARR_API_KEY
    path_map:
      local_prefix: /mnt/downloads/complete/radarr
      arr_prefix: /mnt/downloads/complete/radarr

folders:
  - path: /mnt/downloads/complete/sonarr
    type: downloads
    destination: /mnt/downloads/converted/sonarr
    arr_instance: sonarr
    extensions: [".mkv", ".mp4"]
    exclude_regex:
      - "(?i)sample"
      - "_UNPACK_"
    encode_config:
      quality: 96
      target_quality_mode: vmaf
      max_encoded_percent: 80
      preset: 2
      pixel_format: yuv420p10le
      encoder: hevc_qsv
      encoder_args:
        look_ahead: "1"
        look_ahead_depth: "40"
      auto_crop: true
      crop_detect:
        window: 25s
        limit: 24
        round: 2
      audio_processing:
        disable: false
        languages_to_keep: ["deu"]
        add_stereo_tracks: true
        stereo_tracks:
          codec: libopus
          bitrate: 96000
          per_channel: true
      dolby_vision:
        enabled: true

  - path: /mnt/downloads/complete/radarr
    type: downloads
    destination: /mnt/downloads/converted/radarr
    arr_instance: radarr
    extensions: [".mkv", ".mp4"]
    exclude_regex:
      - "(?i)sample"
      - "_UNPACK_"
    encode_config:
      quality: 97
      target_quality_mode: vmaf
      max_encoded_percent: 80
      preset: 2
      pixel_format: yuv420p10le
      encoder: hevc_qsv
      encoder_args:
        look_ahead: "1"
        look_ahead_depth: "40"
      auto_crop: true
      crop_detect:
        window: 25s
        limit: 24
        round: 2
      audio_processing:
        disable: false
        languages_to_keep: ["deu"]
        add_stereo_tracks: true
        stereo_tracks:
          codec: libopus
          bitrate: 96000
          per_channel: true
      dolby_vision:
        enabled: true
