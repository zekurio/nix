# Tubifarry 2.1.1 puts peer data in release titles. Its CalculatePriority score
# is lost in AlbumData.ToReleaseInfo, so Configarr scores these fields explicitly.
# Only Usenet and Soulseek are enabled below; an unmarked release is Usenet.
customFormatDefinitions:
  - trash_id: music-usenet
    name: Music Usenet
    includeCustomFormatWhenRenaming: false
    specifications:
      - name: No Soulseek peer marker
        implementation: ReleaseTitleSpecification
        negate: true
        required: true
        fields:
          value: '\[👤 [^\]]+\]'
  - trash_id: soulseek-free-slot
    name: Soulseek Free Slot
    includeCustomFormatWhenRenaming: false
    specifications:
      - name: Free upload slot
        implementation: ReleaseTitleSpecification
        negate: false
        required: true
        fields:
          value: '\[⚡ \d+[.,]\d{2}MB/s \]'
  - trash_id: soulseek-fast
    name: Soulseek 1 MB per second
    includeCustomFormatWhenRenaming: false
    specifications:
      - name: At least 1 MiB per second
        implementation: ReleaseTitleSpecification
        negate: false
        required: true
        fields:
          value: '\[(?:⚡|❌) [1-9]\d*[.,]\d{2}MB/s \]'
  - trash_id: soulseek-very-fast
    name: Soulseek 10 MB per second
    includeCustomFormatWhenRenaming: false
    specifications:
      - name: At least 10 MiB per second
        implementation: ReleaseTitleSpecification
        negate: false
        required: true
        fields:
          value: '\[(?:⚡|❌) [1-9]\d+[.,]\d{2}MB/s \]'
  - trash_id: soulseek-empty-queue
    name: Soulseek Empty Queue
    includeCustomFormatWhenRenaming: false
    specifications:
      - name: Soulseek peer
        implementation: ReleaseTitleSpecification
        negate: false
        required: true
        fields:
          value: '\[👤 [^\]]+\]'
      - name: No queued transfers
        implementation: ReleaseTitleSpecification
        negate: true
        required: true
        fields:
          value: '\[📋 \d+\]'
  - trash_id: soulseek-short-queue
    name: Soulseek Short Queue
    includeCustomFormatWhenRenaming: false
    specifications:
      - name: One to nine queued transfers
        implementation: ReleaseTitleSpecification
        negate: false
        required: true
        fields:
          value: '\[📋 [1-9]\]'

custom_formats:
  # Usenet's 1000 beats the maximum combined peer score of 400 at equal quality.
  - trash_ids: [music-usenet]
    assign_scores_to:
      - {name: Lossless, score: 1000}
      - {name: Lossless + HQ Lossy, score: 1000}
  - trash_ids: [soulseek-free-slot]
    assign_scores_to:
      - {name: Lossless, score: 200}
      - {name: Lossless + HQ Lossy, score: 200}
  - trash_ids: [soulseek-fast]
    assign_scores_to:
      - {name: Lossless, score: 100}
      - {name: Lossless + HQ Lossy, score: 100}
  - trash_ids: [soulseek-very-fast, soulseek-empty-queue]
    assign_scores_to:
      - {name: Lossless, score: 50}
      - {name: Lossless + HQ Lossy, score: 50}
  - trash_ids: [soulseek-short-queue]
    assign_scores_to:
      - {name: Lossless, score: 25}
      - {name: Lossless + HQ Lossy, score: 25}

quality_profiles:
  - name: Lossless
    reset_unmatched_scores: {enabled: true}
    min_format_score: 0
    # Peer availability is transient. Upgrade audio quality, not peer scores.
    upgrade: {allowed: true, until_quality: Lossless, until_score: 0}
    qualities:
      - name: Lossless
        qualities: [FLAC, ALAC, FLAC 24bit]
  - name: Lossless + HQ Lossy
    reset_unmatched_scores: {enabled: true}
    min_format_score: 0
    upgrade: {allowed: true, until_quality: Lossless, until_score: 0}
    qualities:
      - name: Lossless
        qualities: [FLAC, ALAC, FLAC 24bit]
      - name: HQ Lossy
        qualities: [MP3-320, MP3-VBR-V0, AAC-320, AAC-256]

metadata_profiles:
  - name: Music
    primary_types: [Album, EP, Single]
    secondary_types: [Studio, Soundtrack, Compilation, Live, Remix]
    release_statuses: [Official]

delay_profiles:
  default:
    # The plugins API uses protocol names, not the old Usenet/Torrent enum.
    items:
      - {name: Usenet, protocol: UsenetDownloadProtocol, allowed: true, delay: 0}
      - {name: Soulseek, protocol: SoulseekDownloadProtocol, allowed: true, delay: 0}
      - {name: Torrent, protocol: TorrentDownloadProtocol, allowed: false, delay: 0}
      # Tubifarry enables missing protocols at startup, so keep explicit denials.
      - {name: Youtube, protocol: YoutubeDownloadProtocol, allowed: false, delay: 0}
      - {name: Lucida, protocol: LucidaDownloadProtocol, allowed: false, delay: 0}
      - {name: Qobuz, protocol: QobuzDownloadProtocol, allowed: false, delay: 0}
      - {name: SubSonic, protocol: SubSonicDownloadProtocol, allowed: false, delay: 0}
      - {name: AmazonMusic, protocol: AmazonMusicDownloadProtocol, allowed: false, delay: 0}
    bypassIfHighestQuality: false
    bypassIfAboveCustomFormatScore: false

media_naming_api:
  renameTracks: true
  replaceIllegalCharacters: true
  artistFolderFormat: '{Artist Name}'
  standardTrackFormat: '{Album Title}/{track:00} - {Track Title}'
  multiDiscTrackFormat: '{Album Title}/Disc {medium:0}/{track:00} - {Track Title}'

media_management:
  setPermissionsLinux: true
  # Lidarr accepts three octal digits; the shared parent supplies setgid/ACLs.
  chmodFolder: '775'
  allowFingerprinting: allFiles
  importExtraFiles: true
  extraFileExtensions: 'jpg,jpeg,png,lrc'
